<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>intelligentOne Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5em;
            color: #667eea;
            margin-bottom: 10px;
        }

        .tagline {
            color: #666;
            font-size: 1.1em;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-value {
            font-size: 3em;
            font-weight: bold;
            color: #667eea;
            margin: 10px 0;
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .blueprints-section {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .blueprint-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .blueprint-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            transition: all 0.3s;
        }

        .blueprint-card:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        .blueprint-name {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .blueprint-description {
            color: #666;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .blueprint-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.9em;
            color: #888;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
        }

        .tool-sequence {
            margin: 10px 0;
        }

        .tool-badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            margin: 2px;
        }

        .activity-section {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .activity-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .activity-item:last-child {
            border-bottom: none;
        }

        .activity-icon {
            font-size: 2em;
        }

        .activity-content {
            flex: 1;
        }

        .activity-time {
            color: #999;
            font-size: 0.9em;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .refresh-info {
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            margin-top: 20px;
            font-size: 0.9em;
        }

        .success-rate {
            color: #22c55e;
            font-weight: bold;
        }

        .score-badge {
            background: #22c55e;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧠 intelligentOne Dashboard</h1>
            <p class="tagline">Self-evolving autonomous intelligence platform</p>
        </header>

        <div class="stats-grid" id="stats">
            <div class="stat-card">
                <div class="stat-label">Total Blueprints</div>
                <div class="stat-value" id="totalBlueprints">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Deployed Today</div>
                <div class="stat-value" id="deployedToday">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Success Rate</div>
                <div class="stat-value success-rate" id="successRate">-%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Avg Score</div>
                <div class="stat-value" id="avgScore">-</div>
            </div>
        </div>

        <div class="blueprints-section">
            <h2>📚 Blueprint Vault</h2>
            <div class="blueprint-grid" id="blueprintGrid">
                <div class="empty-state">
                    <div class="empty-state-icon">🔄</div>
                    <p>Loading blueprints...</p>
                </div>
            </div>
        </div>

        <div class="activity-section">
            <h2>📊 Recent Activity</h2>
            <div id="activityFeed">
                <div class="empty-state">
                    <div class="empty-state-icon">⏱️</div>
                    <p>No recent activity</p>
                </div>
            </div>
        </div>

        <div class="refresh-info">
            🔄 Auto-refresh every 30 seconds | Last updated: <span id="lastUpdate">Never</span>
        </div>
    </div>

    <script>
        async function loadDashboardData() {
            try {
                const response = await fetch('/api/blueprints');
                const data = await response.json();
                
                updateStats(data);
                updateBlueprints(data.blueprints);
                updateActivity(data.blueprints);
                
                document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
            } catch (error) {
                console.error('Error loading dashboard data:', error);
            }
        }

        function updateStats(data) {
            document.getElementById('totalBlueprints').textContent = data.stats.total_blueprints;
            document.getElementById('deployedToday').textContent = data.stats.deployed_today;
            document.getElementById('successRate').textContent = data.stats.success_rate + '%';
            
            // Calculate average score
            const avgScore = data.blueprints.length > 0
                ? Math.round(data.blueprints.reduce((sum, bp) => sum + (bp.score || 0), 0) / data.blueprints.length)
                : 0;
            document.getElementById('avgScore').textContent = avgScore;
        }

        function updateBlueprints(blueprints) {
            const grid = document.getElementById('blueprintGrid');
            
            if (blueprints.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🎯</div>
                        <p>No blueprints yet. Start by asking intelligentOne to create a workflow!</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = blueprints.map(bp => {
                const successRate = bp.total_runs > 0
                    ? Math.round((bp.success_count / bp.total_runs) * 100)
                    : 100;
                
                const tools = bp.tool_sequence.map(t => 
                    `<span class="tool-badge">${t.tool}</span>`
                ).join('');

                return `
                    <div class="blueprint-card">
                        <div class="blueprint-name">${bp.name}</div>
                        <div class="blueprint-description">${bp.description || 'No description'}</div>
                        <div class="tool-sequence">${tools}</div>
                        <div class="blueprint-meta">
                            <span>Score: <span class="score-badge">${bp.score || 'N/A'}</span></span>
                            <span>Runs: ${bp.total_runs || 0}</span>
                            <span>Success: ${successRate}%</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateActivity(blueprints) {
            const feed = document.getElementById('activityFeed');
            
            if (blueprints.length === 0) {
                feed.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⏱️</div>
                        <p>No activity yet</p>
                    </div>
                `;
                return;
            }

            // Sort by created_at
            const recent = [...blueprints]
                .sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0))
                .slice(0, 5);

            feed.innerHTML = recent.map(bp => {
                const time = bp.created_at ? new Date(bp.created_at).toLocaleString() : 'Unknown';
                return `
                    <div class="activity-item">
                        <div class="activity-icon">✅</div>
                        <div class="activity-content">
                            <strong>${bp.name}</strong> deployed
                            <div class="activity-time">${time}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Load data on page load
        loadDashboardData();

        // Auto-refresh every 30 seconds
        setInterval(loadDashboardData, 30000);
    </script>
</body>
</html>
